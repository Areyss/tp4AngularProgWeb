<div class="container py-4">

  <!-- Encabezado -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Productos Destacados</h2>
    <button class="btn btn-dark position-relative" (click)="abrirModal()">
      🛒
      <span class="badge bg-danger ms-1">{{ carrito.length }}</span>
    </button>
  </div>

  <!-- Cards de productos -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" *ngFor="let producto of productos">
      <div class="card h-100 shadow-sm">
        <img [src]="producto.img" class="card-img-top" [alt]="producto.nombre">
        <div class="card-body">
          <h5 class="card-title">{{ producto.nombre }}</h5>
          <p class="card-text text-muted">{{ producto.descripcion }}</p>
          <p class="fw-bold">${{ producto.precio | number:'1.0-2' }}</p>
        </div>
        <div class="card-footer">
          <button
            class="btn w-100"
            [class.btn-success]="!estaEnCarrito(producto)"
            [class.btn-secondary]="estaEnCarrito(producto)"
            [disabled]="estaEnCarrito(producto)"
            (click)="agregarAlCarrito(producto)">
            {{ estaEnCarrito(producto) ? '✓ Agregado' : 'Agregar al carrito' }}
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Modal carrito -->
<div class="modal-backdrop fade show" *ngIf="mostrarModal" (click)="cerrarModal()"></div>

<div class="modal fade show d-block" *ngIf="mostrarModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Mi Carrito</h5>
        <button class="btn-close" (click)="cerrarModal()"></button>
      </div>

      <div class="modal-body">
        <p class="text-muted" *ngIf="carrito.length === 0">El carrito está vacío.</p>
        <ul class="list-group" *ngIf="carrito.length > 0">
          <li class="list-group-item" *ngFor="let item of carrito">
            <div class="d-flex gap-3">
          
              <!-- Columna 1: Imagen  -->
              <img [src]="item.img" [alt]="item.nombre"
                style="width: 55px; height: 55px; object-fit: cover; border-radius: 6px; flex-shrink: 0;">
          
              <!-- Columna 2: Nombre y controles -->
              <div class="flex-grow-1">
                <div class="fw-bold">{{ item.nombre }}</div>
                <div class="d-flex align-items-center justify-content-between gap-2 mt-1">
                  <div class="d-flex gap-3 align-items-center">
                    <button class="btn btn-sm btn-outline-secondary">−</button>
                    <span class="fw-bold">1</span>
                    <button class="btn btn-sm btn-outline-secondary">+</button>
                  </div>          
                  <span >{{ item.precio | currency:'$':'symbol':'1.0-2' }}</span>
                </div>
              </div>
          
              <!-- Columna 3: Botón borrar  -->
              <div class="d-flex align-items-center">
                <button class="btn btn-sm btn-outline-danger" (click)="eliminarDelCarrito(item)">✕</button>
              </div>
          
            </div>
          </li>
        </ul>
      </div>
      <div class="modal-footer justify-content-between" *ngIf="carrito.length > 0">
        <strong>Total: {{ total | currency:'$':'symbol':'1.0-2' }}</strong>
        <button class="btn btn-success">Checkout</button>
      </div>
    </div>
  </div>
</div>
